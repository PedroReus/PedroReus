<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Texto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Comparador de Texto</h1>

    <div class="container">
        <div class="input-area">
            <h2>Texto 1</h2>
            <textarea id="text1" rows="10" cols="50"></textarea>
            <input type="file" id="file1" accept=".txt">
        </div>
        <div class="input-area">
            <h2>Texto 2</h2>
            <textarea id="text2" rows="10" cols="50"></textarea>
            <input type="file" id="file2" accept=".txt">
        </div>
        <div class="input-area">
            <h2>Texto 3</h2>
            <textarea id="text3" rows="10" cols="50"></textarea>
            <input type="file" id="file3" accept=".txt">
        </div>
    </div>

    <div class="controls">
        <label for="comparison">Comparar:</label>
        <select id="comparison">
            <option value="1v2">Texto 1 vs. Texto 2</option>
            <option value="1v3">Texto 1 vs. Texto 3</option>
            <option value="2v3">Texto 2 vs. Texto 3</option>
        </select>
        <button id="compare-btn">Comparar</button>
        <button id="download-btn" disabled>Descargar Informe</button>
    </div>

    <div id="results-area">
        <h2>Resultados</h2>
        <div id="summary"></div>
        <div id="diff-output"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/8.0.2/diff.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
